name: Build Linux Release

on:
#  push:
#    tags:
#      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvterm-dev pkg-config

      - name: Build
        run: make

      - name: Rename binary
        run: mv termlets termlets-linux-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: termlets-linux-x86_64
