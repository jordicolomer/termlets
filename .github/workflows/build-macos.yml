name: Build macOS Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: termlet
